name: Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pip install poetry==1.8.*

      - name: Install package and dev dependencies
        run: poetry install --with dev

      - name: Run unit tests
        run: poetry run pytest tests/unit/ --tb=short -q

      - name: Check shell script syntax
        run: |
          find . -name '*.sh' -not -path './.git/*' -print0 \
            | xargs -0 -n1 bash -n

      # Drives run.sh against a stub snakemake -- no Snakemake, Singularity or
      # Gaussian needed, so it belongs in CI rather than the cluster-only
      # integration tests.
      - name: Run run.sh CLI tests
        run: bash tests/cli/test_run_sh.sh

  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pip install poetry==1.8.*

      - name: Build wheel and sdist
        run: poetry build

      - name: Smoke-test wheel install
        run: |
          python -m venv .venv-smoke
          .venv-smoke/bin/pip install --quiet dist/*.whl
          .venv-smoke/bin/qm-lux --help

      - name: Upload wheel as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: qm-lux-wheel
          path: dist/*.whl
          retention-days: 7
