input_file: resources/input.csv

results_directory: results_example

crest_threads: 8

# Number of CPU cores per Gaussian job.
# Set this to the number of cores your Gaussian license permits.
# Becomes %nprocshared in the .gjf AND the scheduler's CPU request, so the two
# cannot disagree.
gaussian_threads: 24

# Memory per Gaussian job, in GB. Becomes %mem in the .gjf; the scheduler is
# asked for 25% more (4 GB minimum) to cover Gaussian's overhead on top of the
# %mem pool. Default 20.
gaussian_mem_gb: 20

# Singularity image (absolute path to the local .sif file)
qmlux_image: /path/to/qm-lux.sif   # pulled from ghcr.io/bedapub/qm-lux:latest

# ── Stereochemistry (data_preparation -c) ───────────────────────────────────
# NO  (default) — enumerate all diastereoisomers of unassigned chiral centres.
# YES (exceptional) — keep the stereo assignment given in the input, drop
#     compounds with more than one unassigned chiral centre, and skip compounds
#     already present in chirality_current_df. YES requires that key.
#     Quote the value — unquoted YAML NO/YES are booleans, not strings.
chirality_check: "NO"
#chirality_current_df: /path/to/already_processed.pkl

# ML model parameters
model_method: RF
model_descriptor: fp_Morganclean__descriptors_SMILES_CLEAN__100-1000

# ── Model sourcing (choose ONE of the three options below) ──────────────────
#
# Option 1 — Local directory (user-provided files or pre-downloaded model).
#   Set to the folder that contains model.sav and scaler.pkl.
#   Use this if you have the files on disk already.
#
#model_local_folder: /path/to/my/model_dir
#
# Option 2 — GitHub release download (default; requires a public network connection).
#   The workflow downloads model.sav and scaler.pkl from the GitHub release.
#   This is the recommended option for most users.
#
model_github_url: https://github.com/bedapub/QM-LUX/releases/download/v1.0.0
#
# Option 3 — Arvados Keep-web.
#   Requires ARVADOS_API_TOKEN to be set in the calling shell.
#   Set model_arv_keepweb_url to the base URL of your Arvados Keep-web service.
#
#model_arv_uuid: <collection-uuid>
#model_arv_keepweb_url: https://collections.example.com
#model_arv_folder_name:    # leave empty if model files are at collection root

# ── Singularity bind mounts ─────────────────────────────────────────────────
# Singularity does not auto-mount filesystems outside $HOME. run.sh derives
# mounts for the paths named above (input_file, results_directory,
# model_local_folder, qmlux_image), so list only the ADDITIONAL top-level paths
# the workflow reads from or writes to. Whatever you list is kept as given.
# Set QM_LUX_NO_AUTO_BIND=1 to disable the derivation.
singularity_args_param: "--cleanenv --bind /tmp"
